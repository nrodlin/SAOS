[metadata]
name = SAOS
description = SAOS
author = nrodlin
version = attr: SAOS.__version__
license = GPLv3
license_files = LICENSE
platforms = linux
url = https://github.com/nrodlin/SAOS
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.13
    Operating System :: OS Independent
    Intended Audience :: Science/Research
    Topic :: Scientific/Engineering

[options]
packages = find:
install_requires =
    h5py
    joblib
    matplotlib
    numpy
    opencv-contrib-python
    pvlib
    pyzmq
    scipy
    torch
python_requires =
    >=3.10
package_dir =
    =.
zip_safe =
    no
include_package_data = False

[options.packages.find]
include =
    SAOS
    SAOS.*

[options.package_data]
SAOS.images = *.png

[options.entry_points]
console_scripts =
    saos-download-data = SAOS.data:main
