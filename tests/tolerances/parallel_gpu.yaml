# Tolerances of tests/test_parallel_gpu.py (provisional, calibrated 2026-10-26, GTX 1660, torch CPU/CUDA).
threads:
  exact: 0.0                    # bit equality: the same computation, only the scheduling differs
cpu_gpu:
  dm_rel: 1.0e-12               # float64 influence matrix product (ordering of the sums): relative to the maximum
  sciencecam_rel: 1.0e-10       # complex128 FFT, normalised PSF: relative to the peak
  shackhartmann_frame_rel: 1.0e-6   # complex64 cube (ShackHartmann.py:465) -> float32 precision: relative to the peak; measured 2e-7
  shackhartmann_slope_px: 1.0e-5    # centroid in float32 (torch.Tensor(image)): absolute [px]; measured 1.9e-6
  controller_rel: 1.0e-10       # float64 matrix products and Cholesky/SVD on both devices, 10 steps: relative to the maximum
  im_slope_px: 1.0e-5           # |IM_cpu - IM_gpu| x stroke: float32 WFS slopes, absolute [px]; measured 4.3e-6
vram:
  budget_mib: 8.7               # re-recorded 2026-10-27 after the WFS block (pupil sampled at npix_pupil > npix_lenslet to remove spot aliasing, #54): peak 8.62 MiB (was 6.69 MiB), GTX 1660
  headroom: 1.25                # regression allowance over the recorded peak (a leak or a copy per step trips it)
threads_count:
  max_threads: 0                # 0 -> os.cpu_count()
