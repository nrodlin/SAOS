# Tolerances of tests/test_atmosphere.py (absolute, on ratios). Statistical tolerances are ~3.5 sigma of the estimator,
# sigma measured over 10 seeds (2026-10-26); small r = up to a quarter of the screen, large r = up to half the screen.
theory:
  hankel: 1.0e-4            # numerical quadrature accuracy of the Hankel transform
  kolmogorov_limit: 0.01    # von Karman (L0 1e5 m) vs Kolmogorov at r = 1-10 mm: leading correction O((r/L0)^1/3) ~ 0.7%
initial_screen:             # 200 screens of 64 px (4 m), r0 0.10 m, L0 25 m. 10 seeds: mean 1.000-1.017, sigma 0.008-0.022
  D_ratio_small_r: 0.05     # 4 px <= r <= 16 px (sigma <= 0.015)
  D_ratio_large_r: 0.08     # 16 px < r <= 32 px (sigma <= 0.022)
  anisotropy: 0.12          # mean over 4-16 px of D_x/D_y (sigma ~0.035)
  r0_joint: 0.04            # fitted/true r0, joint r0-L0 fit
  r0_fixed: 0.03            # fitted/true r0 with L0 fixed
extruded_screen:            # 32 px (2 m), 4000 rows, ~124 samples. 10 seeds: mean 0.96-0.99, sigma 0.016-0.059
  D_ratio_small_r: 0.08     # 1 px <= r <= 8 px (sigma <= 0.04)
  D_ratio_large_r: 0.15     # 8 px < r <= 16 px (sigma <= 0.059; the -4% hinted at nx/2 is resolved in extruded_lowfreq)
  D_ratio_axis: 0.20        # per axis, all lags (sigma <= 0.087)
  r0_joint: 0.06
  r0_fixed: 0.05
psd:                        # 200 screens of 64 px, Hann window, band 6/L - 0.3/dx (first bins dominated by window leakage)
  amplitude: 0.15
  slope: 0.15
outer_scale_initial:        # 128 px x 0.5 m (64 m), r0 0.5, L0 25, 40 screens, fit from lag 2 px. 10 seeds (2026-10-26): r0 mean 1.013 sigma 0.007, L0 mean 1.016 sigma 0.021
  L0_atol: 0.075            # fitted/true L0, 3.5 sigma
  r0_atol: 0.025            # fitted/true r0, 3.5 sigma
outer_scale_extruded:       # 64 px x 1 m, r0 1, L0 25, 20000 rows (312 samples), fit from lag 2 px. 10 seeds: r0 mean 0.994 sigma 0.004, L0 mean 0.991 sigma 0.010
  L0_atol: 0.035            # 3.5 sigma
  r0_atol: 0.014            # 3.5 sigma
extruded_lowfreq:           # 32 px, 16 screens x 40000 rows, ensemble mean D/D_vK at nx/8, nx/4, nx/2 along and across. 20 seeds measured: mean 0.999-1.008, per-screen sd 0.011-0.035, sem(20) 0.0025-0.0078
  atol: 0.031               # 3.5 x the largest standard error of the mean with 16 screens (0.035 / sqrt(16) = 0.0088, D_x at nx/2)
footprint:
  atol_m: 1.0e-6            # displacement measured on a prescribed linear phase ramp: float precision of the OPD difference (a few 1e-12 m), 1e-6 m = 1e-5 px
