# Tolerances of tests/test_atmosphere_t2.py, calibrated 2026-10-27 with 6 seed sets (SAOS_CI_SEED_OFFSET=1..6).
# Each statistical tolerance is 3.5 x the per-run standard deviation of the estimator (sd), scaled with
# 1/sqrt(n) when the number of realisations differs from the calibration run. None is derived from a SAOS-vs-theory offset.
# The ensemble means over the 6 seeds are recorded in the comments; a mean far from 1 in sd/sqrt(6) units is a candidate bug
# (see the bug registry).
r0_scan:                     # 16 maps per source; all r0 share the random numbers, so the ratios are identical per r0
  n_maps: 16
  initial:                   # joint 1.015 sd 0.009 | fixed 1.043 sd 0.033 | L0 0.86 sd 0.23 (pupil-size screen: L0 weakly constrained)
    r0_joint: [0.032, 0.032, 0.032, 0.032, 0.032, 0.032, 0.032]
    r0_fixed: [0.116, 0.116, 0.116, 0.116, 0.116, 0.116, 0.116]
    logL0:    [0.95, 0.95, 0.95, 0.95, 0.95, 0.95, 0.95]
  extruded:                  # joint 1.001 sd 0.022 | fixed 1.003 sd 0.035 | L0 1.13 sd 0.53
    r0_joint: [0.077, 0.077, 0.077, 0.077, 0.077, 0.077, 0.077]
    r0_fixed: [0.123, 0.123, 0.123, 0.123, 0.123, 0.123, 0.123]
    logL0:    [1.6, 1.6, 1.6, 1.6, 1.6, 1.6, 1.6]
outer_scale:                 # screens spanning the outer-scale turnover
  L0_5:  {r0: 0.011, logL0: 0.021}   # r0 1.013 sd 0.003 | L0 1.008 sd 0.006
  L0_12: {r0: 0.028, logL0: 0.084}   # r0 1.009 sd 0.008 | L0 1.012 sd 0.024
  L0_25: {r0: 0.032, logL0: 0.112}   # r0 1.003 sd 0.009 | L0 1.016 sd 0.032
zernike:                     # n raised from 200 (calibration) to 1000: tolerances = 3.5 sd_200 / sqrt(5)
  initial:                   # 200 screens: mean ratio 0.998 sd 0.054, worst mode sd 0.17, max |offdiag| 0.20 sd 0.06
    n: 1000
    mode: 0.27
    mean: 0.085
    offdiag: 0.18            # expected max |offdiag| ~ 0.20/sqrt(5) = 0.09, + 3.5 x 0.06/sqrt(5)
  atmosphere:                # 200 samples: mean ratio 0.961 sd 0.021 (Z4 0.775 sd 0.074, Z10 0.879 sd 0.04), worst sd 0.10, offdiag 0.18 sd 0.037
    n: 1000
    mode: 0.16
    mean: 0.033
    offdiag: 0.14
frozen_flow:                 # per lag, 3.5 x max sd of the [1-0] and [1-90] cases
  small_r: [0.12, 0.16, 0.19, 0.23, 0.29, 0.34, 0.40, 0.48, 0.61]
  large_r: [0.80, 1.01]
aniso:                       # n raised from 32 to 96: 3.5 sd_32 / sqrt(3); worst sd_32 0.073 (pointwise, 20 arcsec)
  n: 96
  rel: 0.15
seeing:
  rel: 0.084                 # 3.5 x worst sd (0.024, r0 0.25); ensemble SAOS / finite-aperture ~1.00
  formula_accuracy: 0.03     # Tokovinin (2002) approximation vs exact finite-aperture FWHM: 1.3-2.4 % measured, deterministic
