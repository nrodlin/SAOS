# Tolerances of tests/test_corrsh.py (CorrelatingShackHartmann, 6x6 subapertures of 0.1 m, 8 px per subaperture, V band, 0.4"/px,
# lambda/d = 2.58 px, sun patches of 58 px, noise-free unless stated). Policy: tolerances cover the numerical precision of the
# independent reference or estimator statistics; they never absorb a measured SAOS discrepancy. Calibrated 2026-10-27 (CPU, float32).
tilt:
  cog_atol: 0.002       # px; spot centroid vs Fourier-sum reference (M = 256 cells vs 128 pupil samples): measured 4.3e-4
  image_atol: 0.002     # max |spot - reference| / reference peak: measured 3.6e-4
  peak_atol: 1.0e-3     # px; sinc^2 fit of the cut through the peak vs the true shift (measured 3e-6; float32 fit)
centring:
  mirror_atol: 1.0e-5   # I[k] - I[n-k] / peak, float32 (measured 2e-10)
  cog_atol: 5.0e-4      # px; measured 9e-5 (reference = Fourier sum with 256 cells)
  energy_atol: 1.0e-5   # unit energy of the window, float32
m2:
  rel_atol: 0.01        # design bias of the spot second moment <= 1 % (1.22 (u/n)^2 with u = 11.3 lambda/d, n = 128 samples = 0.94 %); measured +0.77 % flat, +0.66 % defocus
partial:
  energy_atol: 1.0e-5   # energy vs mean of the mask block, float32 (measured 1.3e-7)
  shape_atol: 1.0e-4    # |spot - reference| / peak; mask cells align exactly with the pupil samples (16 per pixel), float32 (measured 2e-6)
defocus:
  asym_atol: 1.0e-3     # px, added to the antisymmetry residual of the reference window itself (0.0097 px, window of pixels -n//2 ... n-n//2-1)
  cog_atol: 1.0e-3      # px vs the reference with the pixel-sampled phase (measured 3.8e-4)
conv:
  image_atol: 1.0e-5    # max |image - reference| / peak, float32 FFT (measured 1.5e-7 ... 2.7e-8)
  cog_atol: 1.0e-4      # px (measured 4e-6)
  flux_atol: 1.0e-5     # std/mean of the flux ratio, float32 (measured 1e-7)
linearity:               # owner's specification (2026-10-27)
  use_brightest: 9        # estimator setting under test (owner: 9 in campaigns; 16 tried 2026-10-27: worse)
  range_arcsec: 4.0    # +-10 px = 80 % of the half window (4.25" fails cross-coupling only at the window-edge point)
  n_points: 41
  lin_frac: 0.02          # RMS of the mean slopes about the fitted line <= 2 % of R (owner 2026-10-27)
  cross_frac: 0.03        # RMS over subapertures of the cross slopes <= 3 % of R at every shift (owner, 2026-10-27)
  residual_rms_rad: 0.3   # fixed residual phase making the subaperture images (and the pseudo-reference) differ
isotropy:
  atol: 2.0e-4          # px; same code path for rows and columns, float32 (measured 4e-5)
photons:
  rtol: 1.0e-3          # per-pixel rounding of the photon frame (4e11 photons)
reference:               # pseudo-reference and reference slopes averaged over n frames (noiseFlag=True)
  n_frames: 100           # default n_reference_frames
  n_sigma: 3.5            # sqrt(n) * rms(noisy - clean) / sigma_1 in [1, sqrt(2)] widened by n_sigma / sqrt(2 M), M slopes
