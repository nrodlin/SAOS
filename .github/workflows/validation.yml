# Validation on a self-hosted GitHub Actions runner (labels `saos`, and `gpu` for the nightly and heavy tiers; see
# ci/README.md). Nothing runs periodically: T1 runs on every push to develop/master, T1 + T2 on every pull request to
# master (release gate), and any tier on demand (Actions -> validation -> Run workflow). Jobs triggered while the runner
# is offline wait in the queue (GitHub cancels them after 24 h).
# The repository is public. Pull requests trigger the release gate only when they come from a branch of this repository
# (develop -> master): a pull request from a fork never reaches the self-hosted runner (job-level `if`). Never use
# pull_request_target.
# Release gate: protect master with "Require status checks to pass" on the `release-gate` job (T1 + T2).
name: validation
on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      tier:
        description: 'fast | nightly | heavy'
        type: choice
        options: [fast, nightly, heavy]
        default: fast
permissions:
  contents: read
concurrency:
  group: saos-validation-${{ github.ref }}        # a push to develop never cancels the release gate of a PR
  cancel-in-progress: true
jobs:
  release-gate:
    # T1 + T2 on every pull request to master opened from a branch of this repository (never from a fork)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, saos, gpu]
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - run: ci/run_ci.sh nightly -q
  fast:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.tier == 'fast')
    runs-on: [self-hosted, saos]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: ci/run_ci.sh fast -q
  nightly:
    if: github.event_name == 'workflow_dispatch' && inputs.tier == 'nightly'
    runs-on: [self-hosted, saos, gpu]
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - run: ci/run_ci.sh nightly -q
  heavy:
    if: github.event_name == 'workflow_dispatch' && inputs.tier == 'heavy'
    runs-on: [self-hosted, saos, gpu]
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - run: ci/run_ci.sh heavy -q
