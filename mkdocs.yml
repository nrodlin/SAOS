site_name: SAOS
site_description: Solar Adaptive Optics Simulator — a Python-first, free-threaded simulation framework.
site_url: https://nrodlin.github.io/SAOS/
site_author: SAOS Contributors

repo_name: nrodlin/SAOS
repo_url: https://github.com/nrodlin/SAOS
edit_uri: ""

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs           # top-level nav as horizontal tabs
    - navigation.expand         # expand all nav sections by default (fixes hidden submenus)
    - navigation.indexes        # section index pages (allows clicking a section title)
    - navigation.top            # "back to top" button
    - navigation.footer         # prev/next links at bottom of each page
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

plugins:
  - search
  - mkdocstrings:
      default_handler: python

      handlers:
        python:
          paths: [.]

          options:
            members: true
            inherited_members: true

            docstring_style: numpy
            docstring_section_style: table

            merge_init_into_class: true

            show_signature_annotations: true
            separate_signature: true

            show_source: true
            show_bases: true

            show_root_heading: true
            show_root_full_path: false
            show_object_full_path: false

            members_order: source
            group_by_category: true

            show_if_no_docstring: true
markdown_extensions:
  - attr_list          # enables {.class} syntax on links → md-button, etc.
  - md_in_html         # enables markdown inside <div markdown> blocks (hero, cards)
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Tutorials:
    - tutorials/index.md
    - Introduction to SAOS: tutorials/01_intro_to_saos.ipynb
  - API Reference:
    - api/index.md
    - Telescope: api/telescope.md
    - Source: api/source.md
    - Extended Source: api/extended_source.md
    - Layer: api/layer.md
    - Atmosphere: api/atmosphere.md
    - Light Path: api/light_path.md
    - Deformable Mirror: api/deformable_mirror.md
    - Misregistration: api/misregistration.md
    - Vibration: api/vibration.md
    - Local Seeing: api/local_seeing.md
    - NCPA: api/ncpa.md
    - SHWFS: api/shwfs.md
    - Correlating SHWFS: api/correlating_shwfs.md
    - Detector: api/detector.md
    - Science Camera: api/science_cam.md
    - Interaction Matrix: api/interaction_matrix.md
    - Controller: api/controller.md
    - Learn Estimator: api/learn_estimator.md
    - Sharepoint: api/sharepoint.md
    - Savepoint: api/savepoint.md
    - Reception Point: api/reception_point.md
    - Logging: api/logging_helper.md
    - Data files: api/data.md
  - Validation:
    - testing/index.md
    - test_atmosphere.py: testing/test_atmosphere.md
    - test_atmosphere_t2.py: testing/test_atmosphere_t2.md
    - test_perturbations.py: testing/test_perturbations.md
    - test_timing.py: testing/test_timing.md
    - test_detector.py: testing/test_detector.md
    - test_modal_basis.py: testing/test_modal_basis.md
    - test_dm.py: testing/test_dm.md
    - test_packaging.py: testing/test_packaging.md
    - test_data.py: testing/test_data.md
    - test_wfs.py: testing/test_wfs.md
    - test_corrsh.py: testing/test_corrsh.md
    - test_extended_source.py: testing/test_extended_source.md
    - test_sciencecam.py: testing/test_sciencecam.md
    - test_im_controller.py: testing/test_im_controller.md
    - test_learn_estimator.py: testing/test_learn_estimator.md
    - test_savepoint.py: testing/test_savepoint.md
    - test_sharepoint.py: testing/test_sharepoint.md
    - test_parallel_gpu.py: testing/test_parallel_gpu.md
